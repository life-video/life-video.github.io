<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vidéo</title>
<style>
  :root { --bg: #f3f2f6; --frame: #ffffff; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121117; --frame: #1e1c26; color-scheme: dark; } }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    padding: 16px; box-sizing: border-box;
  }
  video {
    display: block; max-width: 100%; max-height: calc(100dvh - 32px);
    aspect-ratio: 480 / 848; border-radius: 14px; background: var(--frame);
  }
</style>
</head>
<body>
<video src="video.mp4" controls playsinline preload="metadata"></video>
</body>
</html>
